name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ci-insecure-secret-key-change-me
  DJANGO_DEBUG: "True"
  DATABASE_URL: postgres://findly:findly@localhost:5432/findly
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/2
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  NOTIFICATIONS_PUSH_ENABLED: "False"
  NOTIFICATIONS_ASYNC_ENABLED: "False"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src

      - name: Black
        run: black --check src

  test:
    name: Testes e schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findly
          POSTGRES_PASSWORD: findly
          POSTGRES_DB: findly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findly -d findly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django check
        run: python manage.py check

      - name: Migrations sem drift
        run: python manage.py makemigrations --check --dry-run

      - name: Schema OpenAPI válido
        run: python manage.py spectacular --validate --fail-on-warn

      - name: Pytest
        run: python -m pytest
