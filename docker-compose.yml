# =============================================================================
# Findly Backend — Orquestração local (Docker Compose)
# =============================================================================
# Serviços: web (Django), worker/beat (Celery), db (PostgreSQL) e redis.
# Suba tudo com:  docker compose up -d --build   (ou: make up)
# =============================================================================
name: findly

# Variáveis compartilhadas pelos serviços da aplicação (hosts internos da rede).
x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  # ---------------------------------------------------------------------------
  # Banco de dados relacional
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: findly_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findly}
      POSTGRES_USER: ${POSTGRES_USER:-findly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findly} -d ${POSTGRES_DB:-findly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - findly_network

  # ---------------------------------------------------------------------------
  # Redis: cache, broker e result backend do Celery
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: findly_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - findly_network

  # ---------------------------------------------------------------------------
  # Migrações (serviço one-shot): aplica as migrações uma única vez e encerra.
  # web/worker/beat só iniciam após este serviço concluir com sucesso.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findly_migrate
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - findly_network
    restart: "no"

  # ---------------------------------------------------------------------------
  # Aplicação Django (servidor de desenvolvimento)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findly_web
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"   # as migrações são aplicadas pelo serviço `migrate`
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - findly_network

  # ---------------------------------------------------------------------------
  # Celery worker (tarefas assíncronas)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findly_worker
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"   # as migrações são aplicadas pelo serviço `migrate`
    volumes:
      - .:/app
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - findly_network

  # ---------------------------------------------------------------------------
  # Celery beat (agendador de tarefas periódicas)
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findly_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
      - logs_volume:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - findly_network

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:
  logs_volume:

networks:
  findly_network:
    driver: bridge
