# =============================================================================
# Findly Backend — Nginx (produção)
# =============================================================================
# Entrada HTTP única: serve /static/ e /media/ dos volumes e encaminha o resto
# para o gunicorn. Termine o TLS em um proxy externo (ou neste nginx) e garanta
# que X-Forwarded-Proto chegue como "https" quando SECURE_SSL_REDIRECT=True.
# =============================================================================

# Preserva o protocolo informado por um proxy TLS à frente; sem ele, usa o
# esquema da própria conexão (http).
map $http_x_forwarded_proto $findly_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream findly_app {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    # --- Arquivos estáticos (collectstatic) ---------------------------------
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Uploads (fotos de itens e QR Codes) --------------------------------
    # Servidos direto pelo nginx. Não habilite listagem de diretório.
    location /media/ {
        alias /app/media/;
        autoindex off;
        access_log off;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    # --- Healthcheck (liveness) ---------------------------------------------
    location = /health/ {
        proxy_pass http://findly_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $findly_forwarded_proto;
        access_log off;
    }

    # --- API / Swagger / Admin ----------------------------------------------
    location / {
        proxy_pass http://findly_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $findly_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Suporte a WebSocket/HTTP upgrades (uso futuro; inofensivo hoje).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
