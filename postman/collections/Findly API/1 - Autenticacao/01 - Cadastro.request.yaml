$kind: http-request
name: 1. Cadastro
order: 1000
method: POST
url: '{{base_url}}/api/auth/register/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{demo_email}}",
      "full_name": "{{demo_name}}",
      "phone": "11999999999",
      "password": "{{demo_password}}",
      "password_confirm": "{{demo_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));

      const data = pm.response.json();

      if (pm.response.code === 201) {
        pm.test('Conta criada inativa (aguardando verificação)', () => {
          pm.expect(data.user.is_active).to.eql(false);
        });
        pm.environment.set('login_email', data.user.email);
        console.log('Verificação enviada para ' + data.user.email);
        console.log('Abra o e-mail e copie uid e token do link para as variáveis do environment.');
      } else {
        console.log('Se o e-mail já existir, pule para o Login ou use outro demo_email.');
      }
description: |-
  Cria a conta com `is_active=false` e envia o e-mail de confirmação pelo SMTP
  configurado no backend. No ambiente de demonstração o remetente é
  `Findly <findly.unifip@gmail.com>`.

  - `201`: conta criada. Copie `uid` e `token` do link no e-mail para a
    requisição **Verificar e-mail**.
  - `400`: e-mail já cadastrado, senha fraca ou senhas diferentes.

  Se o backend estiver com `EMAIL_BACKEND` de console (sem SMTP), o conteúdo do
  e-mail aparece em `docker compose logs -f web`.
