  emitido (`expires_at` = +24 h) e os demais claims pendentes são recusados.

  O `withdrawal.token` é salvo em `withdrawal_token` pelo script da requisição
  e usado na confirmação da retirada. O token **não** é enviado por e-mail: o
  reivindicante o obtém autenticado na própria conta.
