$kind: http-request
name: 7. Etiqueta QR do item
order: 7000
method: GET
url: '{{base_url}}/api/operations/items/found/:code/label/'
pathVariables:
  - key: code
    value: '{{found_code}}'
    description: Código público do achado.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Resposta é PNG', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('image/png');
      });
description: |-
  Gera sob demanda a etiqueta PNG para colar no item físico, com o payload de
  identificação do achado. Autor, operador e admin podem baixar.
