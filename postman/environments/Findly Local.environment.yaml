name: Findly Local
values:
  - key: base_url
    value: 'http://localhost:8000'
    enabled: true
    type: default
    description: URL da API rodando via Docker Compose.
  - key: demo_name
    value: 'Maria Apresentação'
    enabled: true
    type: default
    description: Nome usado no cadastro de demonstração.
  - key: demo_email
    value: 'apresentacao@findly.local'
    enabled: true
    type: default
    description: E-mail da conta criada no cadastro. Use um endereço que você possa acessar (a verificação chega por SMTP).
  - key: demo_password
    value: 'S3nh@Forte!2026'
    enabled: true
    type: secret
    description: Senha usada no cadastro (apenas desenvolvimento local).
  - key: login_email
    value: 'apresentacao@findly.local'
    enabled: true
    type: default
    description: E-mail usado no login. Troque para a conta admin ao testar /api/users/.
  - key: login_password
    value: 'S3nh@Forte!2026'
    enabled: true
    type: secret
    description: Senha usada no login (alterada automaticamente após o reset).
  - key: access_token
    value: ''
    enabled: true
    type: secret
    description: Preenchido pelo script do Login; enviado como Bearer nas rotas protegidas.
  - key: refresh_token
    value: ''
    enabled: true
    type: secret
    description: Preenchido pelo Login e atualizado pela rotação do Refresh.
  - key: user_id
    value: ''
    enabled: true
    type: default
    description: ID do usuário logado; usado nas rotas de administração.
  - key: verification_uid
    value: ''
    enabled: true
    type: default
    description: Copie o uid do link no e-mail de verificação (ou do console do Django, se o backend estiver sem SMTP).
  - key: verification_token
    value: ''
    enabled: true
    type: secret
    description: Copie o token do link no e-mail de verificação (expira em 24 h).
  - key: reset_uid
    value: ''
    enabled: true
    type: default
    description: Copie o uid do link no e-mail de redefinição de senha.
  - key: reset_token
    value: ''
    enabled: true
    type: secret
    description: Copie o token do link no e-mail de redefinição (expira em 1 h).
  - key: new_password
    value: 'N0vaS3nh@Forte!2026'
    enabled: true
    type: secret
    description: Nova senha aplicada pelo fluxo de recuperação.
  - key: admin_email
    value: 'admin@findly.local'
    enabled: true
    type: default
    description: Conta administradora local (crie/ajuste conforme seu banco).
  - key: admin_password
    value: ''
    enabled: true
    type: secret
    description: Senha do admin local — não é versionada; preencha no seu ambiente.
  - key: found_code
    value: ''
    enabled: true
    type: default
    description: Código público do achado; salvo pela listagem/cadastro da pasta 3.
  - key: lost_code
    value: ''
    enabled: true
    type: default
    description: Código público do alerta de perda; salvo pela listagem/cadastro.
  - key: photo_id
    value: ''
    enabled: true
    type: default
    description: ID da foto do achado; salvo pelo upload.
  - key: point_id
    value: '1'
    enabled: true
    type: default
    description: ID do ponto de coleta; salvo ao listar/criar um ponto.
  - key: point_name
    value: 'Portaria Principal'
    enabled: true
    type: default
    description: Nome usado na criação do ponto de coleta.
  - key: point_address
    value: 'Rua das Flores, 100 - Térreo'
    enabled: true
    type: default
    description: Endereço usado na criação do ponto de coleta.
  - key: point_capacity
    value: '50'
    enabled: true
    type: default
    description: Capacidade do ponto (vazio = ilimitado).
  - key: claim_id
    value: ''
    enabled: true
    type: default
    description: ID da reivindicação; salvo ao abrir/listar um claim.
  - key: claim_message
    value: 'É meu: possui uma etiqueta com meu nome no bolso interno.'
    enabled: true
    type: default
    description: Justificativa enviada ao abrir uma reivindicação.
  - key: withdrawal_token
    value: ''
    enabled: true
    type: secret
    description: Token do QR de retirada; salvo automaticamente na aprovação do claim.
  - key: audit_event_id
    value: ''
    enabled: true
    type: default
    description: ID do evento de auditoria; salvo pela listagem de /api/audit/.
  - key: subscription_id
    value: ''
    enabled: true
    type: default
    description: ID da inscrição de push; salvo ao listar/registrar na pasta 7.
  - key: push_endpoint
    value: 'https://push.example.com/subscriptions/demo-endpoint'
    enabled: true
    type: default
    description: Endpoint de exemplo para testar a inscrição. No app real vem do PushManager.
  - key: push_p256dh
    value: 'BExampleP256dhPublicKeyPlaceholderForLocalTestingOnly'
    enabled: true
    type: default
    description: Chave p256dh de exemplo (o navegador gera a real).
  - key: push_auth
    value: 'example-auth-secret'
    enabled: true
    type: secret
    description: Segredo auth de exemplo (o navegador gera o real).
